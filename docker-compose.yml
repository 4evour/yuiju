name: yuiju

services:
  app:
    image: ghcr.io/yixiaojiu/yuiju:${YUIJU_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3010:3010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./yuiju.config.json:/app/yuiju.config.json:ro
      - ./data/memory:/data/memory

  mongodb:
    image: mongo:8.3.8
    restart: unless-stopped
    volumes:
      - yuiju-mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "mongodb://localhost:27017",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - yuiju-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  yuiju-mongodb-data:
  yuiju-redis-data:
